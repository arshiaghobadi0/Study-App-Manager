[package]
name = "weekly-study-planner"
version = "1.0.0"
description = "برنامه‌ریز درسی هفتگی — نسخه بومی دسکتاپ با زبان Rust (بدون جاوااسکریپت و WebView)"
authors = ["Weekly Study Planner <support@studyplanner.local>"]
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "weekly-study-planner"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13.1", features = ["canvas", "tokio", "image", "advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
