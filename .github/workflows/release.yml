name: Build and Release Multi-Platform Native Binaries (Pure Rust Desktop + Kotlin Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (100% Pure Rust NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run Pure Rust unit tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build Pure Rust Windows binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      - name: Build Windows NSIS installer (.exe)
        shell: bash
        run: |
          makensis packaging/windows/installer.nsi
          mkdir -p release-windows
          cp packaging/windows/*.exe release-windows/
          ls -lh release-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-builds
          path: release-windows/*.exe

  build-linux:
    name: Linux x64 (Pure Rust — .deb, Arch .pkg.tar.zst, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux graphics & packaging libraries (no Node.js, no WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            zstd \
            wget \
            fuse

      - name: Run Pure Rust unit tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build Pure Rust Linux binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      - name: Package Debian (.deb)
        run: |
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/bin deb-pkg/usr/share/applications deb-pkg/usr/share/icons/hicolor/512x512/apps release-linux
          install -m755 desktop/target/release/weekly-study-planner deb-pkg/usr/bin/weekly-study-planner
          install -m644 desktop/assets/icon.png deb-pkg/usr/share/icons/hicolor/512x512/apps/weekly-study-planner.png
          cat << 'EOF' > deb-pkg/usr/share/applications/weekly-study-planner.desktop
          [Desktop Entry]
          Name=Weekly Study Planner
          Comment=Weekly study task planner (Pure Rust) with Jalali/Gregorian dates
          Exec=weekly-study-planner %U
          Terminal=false
          Type=Application
          Icon=weekly-study-planner
          Categories=Education;Office;
          EOF
          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: weekly-study-planner
          Version: 1.0.0
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libc6, libfontconfig1, libxkbcommon0, libx11-6
          Maintainer: Weekly Study Planner <support@studyplanner.local>
          Description: Weekly study task planner (100% Pure Rust / iced)
           Offline-first weekly study task planner with Jalali and Gregorian dates,
           reminders, weekly analytics charts, A4 PDF export, and JSON backup.
          EOF
          dpkg-deb --build deb-pkg release-linux/weekly-study-planner_1.0.0_amd64.deb

      - name: Package Arch Linux (.pkg.tar.zst)
        run: |
          mkdir -p arch-pkg/usr/bin arch-pkg/usr/share/applications arch-pkg/usr/share/icons/hicolor/512x512/apps release-linux
          install -m755 desktop/target/release/weekly-study-planner arch-pkg/usr/bin/weekly-study-planner
          install -m644 desktop/assets/icon.png arch-pkg/usr/share/icons/hicolor/512x512/apps/weekly-study-planner.png
          cp deb-pkg/usr/share/applications/weekly-study-planner.desktop arch-pkg/usr/share/applications/weekly-study-planner.desktop
          PKG_SIZE=$(du -sb arch-pkg/usr | awk '{print $1}')
          BUILD_DATE=$(date +%s)
          cat << EOF > arch-pkg/.PKGINFO
          pkgname = weekly-study-planner
          pkgver = 1.0.0-1
          pkgdesc = Weekly study task planner (100% Pure Rust / iced) with Jalali/Gregorian dates
          url = https://github.com/${{ github.repository }}
          builddate = ${BUILD_DATE}
          packager = GitHub Actions <actions@github.com>
          size = ${PKG_SIZE}
          arch = x86_64
          license = Apache-2.0
          depend = fontconfig
          depend = libxkbcommon
          depend = wayland
          depend = libx11
          EOF
          tar --zstd -C arch-pkg -cf release-linux/weekly-study-planner-1.0.0-1-x86_64.pkg.tar.zst .PKGINFO usr

      - name: Package Universal AppImage (.AppImage)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          install -m755 desktop/target/release/weekly-study-planner AppDir/usr/bin/weekly-study-planner
          install -m644 desktop/assets/icon.png AppDir/weekly-study-planner.png
          install -m644 desktop/assets/icon.png AppDir/usr/share/icons/hicolor/512x512/apps/weekly-study-planner.png
          cp deb-pkg/usr/share/applications/weekly-study-planner.desktop AppDir/weekly-study-planner.desktop
          cp deb-pkg/usr/share/applications/weekly-study-planner.desktop AppDir/usr/share/applications/weekly-study-planner.desktop
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/weekly-study-planner" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir release-linux/WeeklyStudyPlanner-1.0.0-x86_64.AppImage
          ls -lh release-linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-builds
          path: |
            release-linux/*.deb
            release-linux/*.AppImage
            release-linux/*.pkg.tar.zst

  build-macos:
    name: macOS (${{ matrix.label }} — 100% Pure Rust)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon (arm64)
            target: aarch64-apple-darwin
            arch_slug: arm64
          - label: Intel (x64)
            target: x86_64-apple-darwin
            arch_slug: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}

      - name: Run Pure Rust unit tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build Pure Rust macOS binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }} --manifest-path desktop/Cargo.toml

      - name: Create macOS .app bundle and .dmg disk image
        run: |
          APP_DIR="Weekly Study Planner.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" release-macos
          cp "desktop/target/${{ matrix.target }}/release/weekly-study-planner" "$APP_DIR/Contents/MacOS/weekly-study-planner"
          chmod +x "$APP_DIR/Contents/MacOS/weekly-study-planner"

          # Generate .icns icon from PNG via native macOS sips + iconutil
          mkdir -p AppIcon.iconset
          sips -z 16 16     desktop/assets/icon.png --out AppIcon.iconset/icon_16x16.png > /dev/null
          sips -z 32 32     desktop/assets/icon.png --out AppIcon.iconset/icon_16x16@2x.png > /dev/null
          sips -z 32 32     desktop/assets/icon.png --out AppIcon.iconset/icon_32x32.png > /dev/null
          sips -z 64 64     desktop/assets/icon.png --out AppIcon.iconset/icon_32x32@2x.png > /dev/null
          sips -z 128 128   desktop/assets/icon.png --out AppIcon.iconset/icon_128x128.png > /dev/null
          sips -z 256 256   desktop/assets/icon.png --out AppIcon.iconset/icon_128x128@2x.png > /dev/null
          sips -z 256 256   desktop/assets/icon.png --out AppIcon.iconset/icon_256x256.png > /dev/null
          sips -z 512 512   desktop/assets/icon.png --out AppIcon.iconset/icon_256x256@2x.png > /dev/null
          cp desktop/assets/icon.png AppIcon.iconset/icon_512x512.png
          iconutil -c icns AppIcon.iconset -o "$APP_DIR/Contents/Resources/AppIcon.icns"

          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Weekly Study Planner</string>
            <key>CFBundleDisplayName</key>
            <string>Weekly Study Planner</string>
            <key>CFBundleIdentifier</key>
            <string>com.studyplanner.weekly</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleExecutable</key>
            <string>weekly-study-planner</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          mkdir -p dmg-staging
          cp -R "$APP_DIR" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Weekly Study Planner" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "release-macos/WeeklyStudyPlanner-1.0.0-macos-${{ matrix.arch_slug }}.dmg"
          ls -lh release-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: release-macos/*.dmg

  build-android:
    name: Android APK (Native Kotlin & XML)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 35)
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android Kotlin unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Native Android APK (Kotlin + XML)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Stage Android APK artifact
        run: |
          mkdir -p release-android
          APK_FILE=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK produced under android/app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_FILE" release-android/WeeklyStudyPlanner-android.apk
          ls -lh release-android

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: release-android/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 file for every build
        working-directory: release-artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for file in *.exe *.deb *.AppImage *.pkg.tar.zst *.dmg *.apk; do
            sha256sum "$file" > "${file}.sha256"
          done
          ls -lh

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Weekly Study Planner ${{ steps.tag.outputs.TAG_NAME }} (Pure Rust Desktop + Kotlin Android)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.deb
            release-artifacts/*.AppImage
            release-artifacts/*.pkg.tar.zst
            release-artifacts/*.dmg
            release-artifacts/*.apk
            release-artifacts/*.sha256
