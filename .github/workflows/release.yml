name: Build and Release Multi-Platform Rust/Tauri Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (Rust/Tauri NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies & Tauri CLI
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm install --no-save --legacy-peer-deps @tauri-apps/cli@^2

      - name: Generate app icons
        run: npx tauri icon public/pwa-512x512.png

      - name: Build Windows installer (.exe)
        run: npx tauri build --bundles nsis

      - name: Stage Windows artifact
        shell: bash
        run: |
          mkdir -p release-windows
          cp src-tauri/target/release/bundle/nsis/*.exe release-windows/
          ls -lh release-windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-builds
          path: release-windows/*.exe

  build-linux:
    name: Linux x64 (Debian .deb, Arch .pkg.tar.zst, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            zstd

      - name: Install frontend dependencies & Tauri CLI
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm install --no-save --legacy-peer-deps @tauri-apps/cli@^2

      - name: Generate app icons
        run: npx tauri icon public/pwa-512x512.png

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Debian (.deb) and AppImage
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --bundles deb,appimage

      - name: Package Arch Linux (.pkg.tar.zst)
        run: |
          mkdir -p arch-pkg/usr/bin arch-pkg/usr/share/applications arch-pkg/usr/share/icons/hicolor/512x512/apps release-linux
          install -m755 src-tauri/target/release/weekly-study-planner arch-pkg/usr/bin/weekly-study-planner
          install -m644 public/pwa-512x512.png arch-pkg/usr/share/icons/hicolor/512x512/apps/weekly-study-planner.png
          cat << 'EOF' > arch-pkg/usr/share/applications/weekly-study-planner.desktop
          [Desktop Entry]
          Name=Weekly Study Planner
          Comment=Weekly study task planner with Jalali/Gregorian dates
          Exec=weekly-study-planner %U
          Terminal=false
          Type=Application
          Icon=weekly-study-planner
          Categories=Education;Office;
          EOF
          PKG_SIZE=$(du -sb arch-pkg/usr | awk '{print $1}')
          BUILD_DATE=$(date +%s)
          cat << EOF > arch-pkg/.PKGINFO
          pkgname = weekly-study-planner
          pkgver = 1.0.0-1
          pkgdesc = Weekly study task planner (Rust/Tauri) with Jalali/Gregorian dates
          url = https://github.com/${{ github.repository }}
          builddate = ${BUILD_DATE}
          packager = GitHub Actions <actions@github.com>
          size = ${PKG_SIZE}
          arch = x86_64
          license = Apache-2.0
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = libayatana-appindicator
          EOF
          tar --zstd -C arch-pkg -cf release-linux/weekly-study-planner-1.0.0-1-x86_64.pkg.tar.zst .PKGINFO usr

      - name: Stage Debian & AppImage artifacts
        run: |
          mkdir -p release-linux
          cp src-tauri/target/release/bundle/deb/*.deb release-linux/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-linux/
          ls -lh release-linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-builds
          path: |
            release-linux/*.deb
            release-linux/*.AppImage
            release-linux/*.pkg.tar.zst

  build-macos:
    name: macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon (arm64)
            target: aarch64-apple-darwin
          - label: Intel (x64)
            target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies & Tauri CLI
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm install --no-save --legacy-peer-deps @tauri-apps/cli@^2

      - name: Generate app icons
        run: npx tauri icon public/pwa-512x512.png

      - name: Build macOS DMG (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Stage macOS artifact
        run: |
          mkdir -p release-macos
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg release-macos/
          ls -lh release-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: release-macos/*.dmg

  build-android:
    name: Android Release APK (Signed Rust/Tauri)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Android release signing secrets
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ] || [ "$HAS_STORE_PASS" != "true" ] || [ "$HAS_KEY_ALIAS" != "true" ] || [ "$HAS_KEY_PASS" != "true" ]; then
            echo "::error::Missing Android release signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install frontend dependencies & Tauri CLI
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm install --no-save --legacy-peer-deps @tauri-apps/cli@^2

      - name: Generate app icons
        run: npx tauri icon public/pwa-512x512.png

      - name: Initialize Tauri Android project
        run: |
          npx tauri android init --force
          npx tauri icon public/pwa-512x512.png

      - name: Build Android Release APK (arm64 + armv7)
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Align and Sign Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-android
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No release APK produced under src-tauri/gen/android/app/build/outputs/apk"
            exit 1
          fi
          echo "Found release APK: $UNSIGNED_APK"

          KEYSTORE_PATH="/tmp/release-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"

          ALIGNED_APK="/tmp/app-release-aligned.apk"
          SIGNED_APK="release-android/WeeklyStudyPlanner-android-release.apk"

          "$BUILD_TOOLS_PATH/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_PATH/apksigner" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_PATH/apksigner" verify --verbose "$SIGNED_APK"
          rm -f "$KEYSTORE_PATH" "$ALIGNED_APK"
          ls -lh release-android

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: release-android/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 file for every build
        working-directory: release-artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for file in *.exe *.deb *.AppImage *.pkg.tar.zst *.dmg *.apk; do
            sha256sum "$file" > "${file}.sha256"
          done
          ls -lh

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Weekly Study Planner ${{ steps.tag.outputs.TAG_NAME }} (Rust/Tauri)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.deb
            release-artifacts/*.AppImage
            release-artifacts/*.pkg.tar.zst
            release-artifacts/*.dmg
            release-artifacts/*.apk
            release-artifacts/*.sha256
