name: Build and Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (NSIS + Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web bundle for Electron
        env:
          ELECTRON_BUILD: 'true'
        run: npx vite build

      - name: Install Electron & electron-builder
        run: npm install --no-save --legacy-peer-deps electron electron-builder

      - name: Package Windows x64 installers
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-builds
          path: |
            release-desktop/*.exe
            release-desktop/*.exe.blockmap

  build-linux:
    name: Linux x64 (Debian .deb, Arch .pacman, AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packaging system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd rpm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web bundle for Electron
        env:
          ELECTRON_BUILD: 'true'
        run: npx vite build

      - name: Install Electron & electron-builder
        run: npm install --no-save --legacy-peer-deps electron electron-builder

      - name: Package Linux binaries (.deb, .pacman, .AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx electron-builder --linux deb pacman AppImage --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-builds
          path: |
            release-desktop/*.deb
            release-desktop/*.pacman
            release-desktop/*.AppImage

  build-android:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web assets for Capacitor
        env:
          ELECTRON_BUILD: 'true'
        run: npx vite build

      - name: Install Capacitor packages
        run: npm install --no-save --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Generate and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage APK artifact
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/WeeklyStudyPlanner-android-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: release-android/*.apk

  build-macos:
    name: macOS (Apple Silicon & Intel DMG + ZIP)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web bundle for Electron
        env:
          ELECTRON_BUILD: 'true'
        run: npx vite build

      - name: Install Electron & electron-builder
        run: npm install --no-save --legacy-peer-deps electron electron-builder

      - name: Package macOS binaries (.dmg, .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            release-desktop/*.dmg
            release-desktop/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 file for every build
        working-directory: release-artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for file in *.exe *.deb *.pacman *.AppImage *.dmg *.zip *.apk; do
            sha256sum "$file" > "${file}.sha256"
          done
          ls -lh

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Weekly Study Planner ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.deb
            release-artifacts/*.pacman
            release-artifacts/*.AppImage
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.apk
            release-artifacts/*.sha256

