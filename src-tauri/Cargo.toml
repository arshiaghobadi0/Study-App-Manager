[package]
name = "weekly-study-planner"
version = "1.0.0"
description = "برنامه‌ریز درسی هفتگی با تقویم شمسی و میلادی، یادآور، نمودار پیشرفت، خروجی PDF و نسخه پشتیبان JSON"
authors = ["Weekly Study Planner <support@studyplanner.local>"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "weekly_study_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
