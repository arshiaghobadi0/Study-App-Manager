appId: com.studyplanner.weekly
productName: Weekly Study Planner
copyright: Copyright © 2026 Weekly Study Planner
directories:
  output: release-desktop
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - public/pwa-512x512.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/pwa-512x512.png
  artifactName: WeeklyStudyPlanner-Setup-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: WeeklyStudyPlanner-Portable-${version}-win-x64.${ext}
linux:
  category: Education
  icon: public/pwa-512x512.png
  maintainer: Weekly Study Planner <support@studyplanner.local>
  synopsis: برنامه‌ریز درسی هفتگی با تقویم شمسی و میلادی
  description: Weekly study task planner with dual Jalali/Gregorian dates, reminders, analytics, and JSON backup.
  target:
    - target: deb
      arch:
        - x64
    - target: pacman
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
deb:
  artifactName: weekly-study-planner_${version}_amd64.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
pacman:
  artifactName: weekly-study-planner-${version}-x86_64.pacman
AppImage:
  artifactName: WeeklyStudyPlanner-${version}-x86_64.AppImage
